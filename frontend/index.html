<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR Management</title>
    <link rel="icon" type="image/svg+xml" href="favicon.ico" />

    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --primary: #3b82f6;
        --success: #22c55e;
        --error: #ef4444;
        --warning: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
      }

      .app {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
        animation: fadeIn 0.8s ease;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 2.2rem;
      }

      .header p {
        color: var(--muted);
      }

      /* Card */
      .card {
        background: linear-gradient(180deg, #111827, #020617);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        animation: slideUp 0.6s ease;
      }

      /* Form */
      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 10px;
        color: var(--text);
        transition: all 0.25s ease;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        outline: none;
        transform: translateY(-1px);
      }

      small {
        color: var(--muted);
        font-size: 0.75rem;
      }

      /* Layout helpers */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }

      /* Buttons */
      button {
        flex: 1;
        padding: 14px;
        border-radius: 12px;
        font-size: 0.95rem;
        border: none;
        cursor: pointer;
        transition: all 0.25s ease;
        position: relative;
      }

      .primary {
        background: linear-gradient(135deg, var(--primary), #2563eb);
        color: white;
      }

      .secondary {
        background: #1e293b;
        color: var(--text);
      }

      button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
      }

      button:active {
        transform: scale(0.97);
      }

      /* Loading animation */
      .btn-loading {
        pointer-events: none;
        opacity: 0.8;
      }

      .btn-loading::after {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* Results */
      .results {
        margin-top: 30px;
        animation: fadeIn 0.6s ease;
      }

      .result-item {
        background: #020617;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
        animation: slideUp 0.4s ease;
      }

      .result-item.success {
        border-left: 4px solid var(--success);
      }

      .result-item.error {
        border-left: 4px solid var(--error);
      }

      .result-item.warning {
        border-left: 4px solid var(--warning);
      }

      /* Animations */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(12px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>🚀 PR Management</h1>
        <p>
          Create, merge, and inspect GitHub pull requests safely.
          <br />
          <span id="login-status" style="color: var(--warning);">Not logged in</span>
          <button id="login-btn" type="button" class="secondary" style="margin-left: 10px; padding: 6px 12px; font-size: 0.8rem;">
            Login with GitHub
          </button>
          <a href="/profile" style="margin-left: 10px; color: var(--primary);">Profile</a>
        </p>
      </header>

      <main class="card">
        <form id="input-form" novalidate>
          <div class="field">
            <label>PR Title</label>
            <input id="pr-title" placeholder="Automated PR" />
          </div>

          <div class="field">
            <label>PR Description</label>
            <input id="pr-description" placeholder="Created by PR Management" />
          </div>

          <div class="field">
            <label>Repositories *</label>
            <input
              id="repositories"
              placeholder="owner/repo, owner/repo"
              required />
            <small>Example: thomaslynn132/setup</small>
          </div>

          <div class="grid">
            <div class="field">
              <label>Base Branch</label>
              <input id="base-branch" placeholder="main" />
            </div>

            <div class="field">
              <label>Head Branch</label>
              <input id="head-branch" placeholder="feature-branch" />
            </div>
          </div>

          <div class="field">
            <label>Reviewers (optional)</label>
            <input id="reviewers" placeholder="username1, username2, @org/team" />
            <small>Comma-separated usernames or teams (org/team)</small>
          </div>

          <div class="field">
            <label>Merge Method</label>
            <select id="merge-method" style="width:100%;padding:12px 14px;background:#020617;border:1px solid #1e293b;border-radius:10px;color:var(--text);">
              <option value="merge">Merge (default)</option>
              <option value="squash">Squash</option>
              <option value="rebase">Rebase</option>
            </select>
          </div>

          <div class="actions">
            <button id="generate-event" type="button" class="primary">
              Create & Merge
            </button>
            <button id="check-prs" type="button" class="secondary">
              Check PRs
            </button>
            <button id="list-branches" type="button" class="secondary">
              Branches
            </button>
            <button id="pr-status" type="button" class="secondary">
              PR Status
            </button>
            <button id="profile-btn" type="button" class="secondary">
              Profile
            </button>
          </div>

          <div class="field" style="margin-top:16px">
            <label>PR Number (for status check)</label>
            <input id="pr-number" type="number" placeholder="e.g. 123" />
          </div>
        </form>
      </main>

      <section id="pr-check-result" class="results">
        <h2>Results</h2>
        <div id="result-content"></div>
      </section>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        function setResult(html) {
          resultContent.style.opacity = "0";
          setTimeout(() => {
            resultContent.innerHTML = html;
            resultContent.style.opacity = "1";
          }, 120);
        }

        function renderGenerateResult(data) {
          if (!data.success) {
            return setResult(`
      <div class="result-item error">
        <h3>❌ Error</h3>
        <p>${sanitizeHTML(data.message || "Something went wrong")}</p>
      </div>
    `);
          }

          const results = data.githubPR?.results || [];

          if (!results.length) {
            return setResult(`
      <div class="result-item warning">
        <p>No PR actions were performed.</p>
      </div>
    `);
          }

          let html = "";

          results.forEach((item) => {
            if (item.error) {
              html += `
        <div class="result-item error">
          <h3>❌ ${sanitizeHTML(item.repo)}</h3>
          <p>${sanitizeHTML(item.error)}</p>
        </div>
      `;
            } else {
              html += `
        <div class="result-item success">
          <h3>✅ ${sanitizeHTML(item.repo)}</h3>
          <p>PR processed successfully</p>
          ${
            item.url
              ? `<a href="${sanitizeHTML(item.url)}" target="_blank">View PR →</a>`
              : ""
          }
        </div>
      `;
            }
          });

          setResult(html);
        }

        const generateButton = document.getElementById("generate-event");
        const checkPrsButton = document.getElementById("check-prs");
        const listBranchesButton = document.getElementById("list-branches");
        const prStatusButton = document.getElementById("pr-status");
        const profileBtn = document.getElementById("profile-btn");
        const resultContent = document.getElementById("result-content");
        const loginBtn = document.getElementById("login-btn");
        const loginStatus = document.getElementById("login-status");

        const ENC_KEY_NAME = "github_enc_key";

        async function getOrCreateKey() {
          let keyData = localStorage.getItem(ENC_KEY_NAME);
          if (keyData) {
            return await crypto.subtle.importKey(
              "jwk",
              JSON.parse(keyData),
              { name: "AES-GCM" },
              true,
              ["encrypt", "decrypt"]
            );
          }
          const key = await crypto.subtle.generateKey(
            { name: "AES-GCM", length: 256 },
            true,
            ["encrypt", "decrypt"]
          );
          const exported = await crypto.subtle.exportKey("jwk", key);
          localStorage.setItem(ENC_KEY_NAME, JSON.stringify(exported));
          return key;
        }

        async function encryptToken(token) {
          const key = await getOrCreateKey();
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const encoded = new TextEncoder().encode(token);
          const encrypted = await crypto.subtle.encrypt(
            { name: "AES-GCM", iv },
            key,
            encoded
          );
          return JSON.stringify({
            iv: Array.from(iv),
            data: Array.from(new Uint8Array(encrypted))
          });
        }

        async function decryptToken(encrypted) {
          try {
            const key = await getOrCreateKey();
            const { iv, data } = JSON.parse(encrypted);
            const decrypted = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: new Uint8Array(iv) },
              key,
              new Uint8Array(data)
            );
            return new TextDecoder().decode(decrypted);
          } catch (e) {
            return null;
          }
        }

        const TOKEN_KEY = "github_auth";
        let cachedToken = null;

        async function getToken() {
          if (cachedToken) return cachedToken;
          const encrypted = localStorage.getItem(TOKEN_KEY);
          if (!encrypted) return null;
          cachedToken = await decryptToken(encrypted);
          return cachedToken;
        }

        async function isLoggedIn() {
          return !!(await getToken());
        }

        async function updateLoginStatus() {
          const loggedIn = await isLoggedIn();
          if (loggedIn) {
            loginStatus.textContent = "✅ Logged in";
            loginStatus.style.color = "var(--success)";
            loginBtn.textContent = "Logout";
          } else {
            loginStatus.textContent = "Not logged in";
            loginStatus.style.color = "var(--warning)";
            loginBtn.textContent = "Login with GitHub";
          }
        }

        (async () => await updateLoginStatus())();

        loginBtn.addEventListener("click", async () => {
          if (await isLoggedIn()) {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(ENC_KEY_NAME);
            cachedToken = null;
            await updateLoginStatus();
          } else {
            window.open("/oauth/login", "_blank", "width=600,height=700");
          }
        });

        window.addEventListener("storage", (e) => {
          if (e.key === "github_token") {
            updateLoginStatus();
          }
        });

        setInterval(async () => {
          try {
            await updateLoginStatus();
          } catch {}
        }, 1000);

        window.addEventListener("message", async (event) => {
          if (event.data?.type === "github_token") {
            const encrypted = await encryptToken(event.data.token);
            localStorage.setItem(TOKEN_KEY, encrypted);
            cachedToken = event.data.token;
            await updateLoginStatus();
          }
        });

        function sanitizeHTML(str) {
          const div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        }

        function validateRepo() {
          const field = document.getElementById("repositories");
          field.style.borderColor = "#ddd";
          if (!field.value.trim()) {
            field.style.borderColor = "#dc3545";
            return false;
          }
          return true;
        }

        function displayError(message, error) {
          resultContent.innerHTML = `
      <div class="result-item error">
        <h3>❌ Error</h3>
        <p>${sanitizeHTML(message)}</p>
        ${error ? `<pre>${sanitizeHTML(error)}</pre>` : ""}
      </div>
    `;
        }

        generateButton.addEventListener("click", async () => {
          if (!await isLoggedIn()) {
            displayError("Please login with GitHub first.");
            return;
          }
          if (!validateRepo()) {
            displayError("Please fill in repository field.");
            return;
          }

          generateButton.classList.add("btn-loading");
          generateButton.disabled = true;

          try {
            const response = await fetch("/api/generate-event", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                token: await getToken(),
                title:
                  document.getElementById("pr-title").value || "Automated PR",
                description:
                  document.getElementById("pr-description").value ||
                  "Created by PR Management System",
                repositories: document.getElementById("repositories").value,
                baseBranch:
                  document.getElementById("base-branch").value || "main",
                headBranch:
                  document.getElementById("head-branch").value ||
                  "feature-branch",
                reviewers: document.getElementById("reviewers").value,
                mergeMethod: document.getElementById("merge-method").value,
              }),
            });

            const data = await response.json();
            renderGenerateResult(data);
          } catch (err) {
            displayError("Failed to connect to server", err.message);
          } finally {
            generateButton.classList.remove("btn-loading");
            generateButton.disabled = false;
          }
        });

        checkPrsButton.addEventListener("click", async () => {
          if (!await isLoggedIn()) {
            displayError("Please login with GitHub first.");
            return;
          }
          if (!validateRepo()) {
            displayError("Please fill in repository field.");
            return;
          }

          checkPrsButton.classList.add("btn-loading");
          checkPrsButton.disabled = true;

          try {
            const repo = document
              .getElementById("repositories")
              .value.split(",")[0]
              .trim();

            const response = await fetch("/api/check-pr", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: getToken(), repository: repo }),
            });

            const data = await response.json();
            renderPRListResult(data);
          } catch (err) {
            displayError("Failed to connect to server", err.message);
          } finally {
            checkPrsButton.classList.remove("btn-loading");
            checkPrsButton.disabled = false;
          }
        });

        listBranchesButton.addEventListener("click", async () => {
          if (!await isLoggedIn()) {
            displayError("Please login with GitHub first.");
            return;
          }
          if (!validateRepo()) {
            displayError("Please fill in repository field.");
            return;
          }

          listBranchesButton.classList.add("btn-loading");
          listBranchesButton.disabled = true;

          try {
            const repo = document
              .getElementById("repositories")
              .value.split(",")[0]
              .trim();

            const response = await fetch("/api/branches", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: getToken(), repository: repo }),
            });

            const data = await response.json();
            renderBranchesResult(data);
          } catch (err) {
            displayError("Failed to connect to server", err.message);
          } finally {
            listBranchesButton.classList.remove("btn-loading");
            listBranchesButton.disabled = false;
          }
        });

        prStatusButton.addEventListener("click", async () => {
          if (!await isLoggedIn()) {
            displayError("Please login with GitHub first.");
            return;
          }
          if (!validateRepo()) {
            displayError("Please fill in repository field.");
            return;
          }

          const prNum = document.getElementById("pr-number").value;
          if (!prNum) {
            displayError("Please enter a PR number.");
            return;
          }

          prStatusButton.classList.add("btn-loading");
          prStatusButton.disabled = true;

          try {
            const repo = document
              .getElementById("repositories")
              .value.split(",")[0]
              .trim();

            const response = await fetch("/api/pr-status", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: getToken(), repository: repo, pullNumber: prNum }),
            });

            const data = await response.json();
            renderPRStatusResult(data);
          } catch (err) {
            displayError("Failed to connect to server", err.message);
          } finally {
            prStatusButton.classList.remove("btn-loading");
            prStatusButton.disabled = false;
          }
        });

        profileBtn.addEventListener("click", async () => {
          if (!await isLoggedIn()) {
            displayError("Please login with GitHub first.");
            return;
          }

          profileBtn.classList.add("btn-loading");
          profileBtn.disabled = true;

          try {
            const response = await fetch("/api/profile", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token: await getToken() }),
            });

            const data = await response.json();
            renderProfileResult(data);
          } catch (err) {
            displayError("Failed to connect to server", err.message);
          } finally {
            profileBtn.classList.remove("btn-loading");
            profileBtn.disabled = false;
          }
        });

        function renderPRListResult(data) {
          if (!data.success) {
            return setResult(`
      <div class="result-item error">
        <h3>❌ Error</h3>
        <p>${sanitizeHTML(data.message || "Something went wrong")}</p>
      </div>
    `);
          }

          const prs = data.pullRequests || [];
          if (!prs.length) {
            return setResult(`
      <div class="result-item warning">
        <p>No open PRs found.</p>
      </div>
    `);
          }

          let html = `<h3>Open PRs in ${sanitizeHTML(data.repository)}</h3>`;
          prs.forEach(pr => {
            html += `
        <div class="result-item">
          <h4>#${pr.number}: ${sanitizeHTML(pr.title)}</h4>
          <p>By ${sanitizeHTML(pr.user)} • ${new Date(pr.createdAt).toLocaleDateString()}</p>
          <a href="${sanitizeHTML(pr.url)}" target="_blank">View PR →</a>
        </div>
      `;
          });
          setResult(html);
        }

        function renderBranchesResult(data) {
          if (!data.success) {
            return setResult(`
      <div class="result-item error">
        <h3>❌ Error</h3>
        <p>${sanitizeHTML(data.message || "Something went wrong")}</p>
      </div>
    `);
          }

          const branches = data.branches || [];
          let html = `<h3>Branches in ${sanitizeHTML(data.repository)}</h3>
      <p>Default: ${sanitizeHTML(data.defaultBranch)}</p>`;
          
          branches.forEach(branch => {
            html += `
        <div class="result-item">
          <h4>${branch.protected ? "🛡️ " : ""}${sanitizeHTML(branch.name)}</h4>
          <small>${branch.sha.substring(0, 7)}</small>
        </div>
      `;
          });
          setResult(html);
        }

        function renderPRStatusResult(data) {
          if (!data.success) {
            return setResult(`
      <div class="result-item error">
        <h3>❌ Error</h3>
        <p>${sanitizeHTML(data.message || "Something went wrong")}</p>
      </div>
    `);
          }

          const pr = data.pullRequest;
          const checks = data.checks;
          
          let html = `
      <div class="result-item">
        <h3>#${pr.number}: ${sanitizeHTML(pr.title)}</h3>
        <p>State: ${pr.state} • Merged: ${pr.merged ? "Yes" : "No"}</p>
        <p>Mergeable: ${pr.mergeable === true ? "Yes" : "No"} (${pr.mergeableState})</p>
        <a href="${sanitizeHTML(pr.url)}" target="_blank">View PR →</a>
      </div>
    `;

          if (checks) {
            html += `
      <div class="result-item">
        <h4>Check Runs (${checks.total})</h4>
        <p>Passed: ${checks.passed} • Failed: ${checks.failed} • Pending: ${checks.pending}</p>
        ${checks.runs.map(run => `
          <div style="margin-left:12px;padding:4px 0;">
            <span style="color:${run.conclusion === "success" ? "var(--success)" : run.conclusion === "failure" ? "var(--error)" : "var(--warning)"}">●</span>
            ${sanitizeHTML(run.name)} - ${run.status}
          </div>
        `).join("")}
      </div>
    `;
          }

          setResult(html);
        }

        function renderProfileResult(data) {
          if (!data.success) {
            return setResult(`
      <div class="result-item error">
        <h3>❌ Error</h3>
        <p>${sanitizeHTML(data.message || "Something went wrong")}</p>
      </div>
    `);
          }

          const user = data.user;
          const history = data.history || [];
          
          let html = `
      <div class="result-item">
        <h3>👤 ${sanitizeHTML(user.username)}</h3>
        <p>Member since: ${new Date(user.created_at).toLocaleDateString()}</p>
      </div>
      <h3>History</h3>
    `;

          if (!history.length) {
            html += `<div class="result-item warning"><p>No history yet.</p></div>`;
          } else {
            history.forEach(item => {
              const statusColor = item.status === "success" ? "var(--success)" : item.status === "error" ? "var(--error)" : "var(--warning)";
              html += `
        <div class="result-item" style="border-left-color:${statusColor}">
          <h4>${item.action === "merged" ? "🔀" : item.action === "created" ? "✨" : item.action === "updated" ? "📝" : "❌"} ${sanitizeHTML(item.repo)} #${item.pr_number || "-"}</h4>
          <p>${sanitizeHTML(item.title || "")}</p>
          <small>${new Date(item.created_at).toLocaleString()}</small>
        </div>
      `;
            });
          }

          setResult(html);
        }
      });
    </script>
  </body>
</html>
